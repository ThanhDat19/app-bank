spring:
  application:
    name: core-banking-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/bank_lab}
    username: ${DB_USERNAME:bank_lab}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    clean-disabled: true
  sql:
    init:
      mode: never

server:
  address: ${SERVER_ADDRESS:127.0.0.1}
  port: ${SERVER_PORT:8080}
  error:
    include-message: never
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

springdoc:
  api-docs:
    enabled: ${API_DOCS_ENABLED:false}
  swagger-ui:
    enabled: ${API_DOCS_ENABLED:false}
    path: /swagger-ui.html
  paths-to-match: /api/v1/**

logging:
  pattern:
    level: "%5p [correlationId=%X{correlationId:-}]"
