spring:
  application:
    name: core-banking-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/bank_lab}
    username: ${DB_USERNAME:bank_lab}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    clean-disabled: true
  sql:
    init:
      mode: never

bank:
  external:
    enabled: ${EXTERNAL_ENABLED:false}
    port: ${EXTERNAL_PARTNER_PORT:9092}
    timeout-millis: ${EXTERNAL_TIMEOUT_MILLIS:1000}
    settlement-account: ${EXTERNAL_SETTLEMENT_ACCOUNT:00000000-0000-0000-0000-000000000000}
  risk:
    enabled: ${RISK_ENABLED:false}
    host: ${RISK_HOST:127.0.0.1}
    port: ${RISK_PORT:9091}
    deadline-millis: ${RISK_DEADLINE_MILLIS:750}
    approval-millis: ${RISK_APPROVAL_MILLIS:5000}
  sse:
    poll-millis: ${SSE_POLL_MILLIS:2000}
    lifetime-millis: ${SSE_LIFETIME_MILLIS:120000}
    max-connections: ${SSE_MAX_CONNECTIONS:32}
    max-per-actor: ${SSE_MAX_PER_ACTOR:2}
  statements:
    max-entries: ${STATEMENT_MAX_ENTRIES:10000}
  reconciliation:
    enabled: ${RECONCILIATION_ENABLED:false}
    grace-seconds: ${RECONCILIATION_GRACE_SECONDS:300}
  kafka:
    enabled: ${KAFKA_ENABLED:false}
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
  outbox:
    relay:
      enabled: ${OUTBOX_RELAY_ENABLED:false}
      batch-size: 1
  iam:
    issuer-uri: ${OIDC_ISSUER_URI}
    jwk-set-uri: ${OIDC_JWK_SET_URI}
    audience: ${OIDC_AUDIENCE}

server:
  address: ${SERVER_ADDRESS:127.0.0.1}
  port: ${SERVER_PORT:8080}
  error:
    include-message: never
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

springdoc:
  api-docs:
    enabled: ${API_DOCS_ENABLED:false}
  swagger-ui:
    enabled: ${API_DOCS_ENABLED:false}
    path: /swagger-ui.html
  paths-to-match: /api/v1/**

logging:
  pattern:
    level: "%5p [correlationId=%X{correlationId:-}]"
